<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatbot</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>💬 Chatbot</h1>
      <div class="controls">
        <select id="persona" title="Persona">
          <option value="assistant">General assistant</option>
          <option value="tutor">Coding tutor</option>
          <option value="interviewer">Interview coach</option>
        </select>
        <button id="clear" class="ghost">New chat</button>
      </div>
    </header>

    <main id="chat" aria-live="polite"></main>

    <form id="form">
      <textarea id="input" rows="1" placeholder="Type a message… (Enter to send, Shift+Enter for a new line)" maxlength="4000"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </div>
  <script src="/app.js"></script>
</body>
</html>
